# StudentService Application Production Configuration Properties

# Database Configuration - Production ready database
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.url = jdbc:mysql://localhost:3306/studentservice_prod?useSSL=true&serverTimezone=UTC
spring.datasource.username = ${DB_USERNAME:studentservice_user}
spring.datasource.password = ${DB_PASSWORD:}

# JPA/Hibernate Configuration for Production
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.show-sql = false
spring.jpa.properties.hibernate.format_sql = false
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

# Server Configuration
server.port = ${SERVER_PORT:8032}

# Logging Configuration for Production
logging.level.org.springframework.web = INFO
logging.level.com.example = INFO
logging.level.root = WARN
logging.pattern.console = %d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file = %d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Application Configuration
spring.application.name = STUDENT-SERVICE

# Eureka Client Configuration for Production
eureka.client.serviceUrl.defaultZone = ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}
eureka.client.enabled = true
eureka.client.register-with-eureka = true
eureka.client.fetch-registry = true
eureka.client.registry-fetch-interval-seconds = 30

# Eureka Instance Configuration for Production
eureka.instance.lease-renewal-interval-in-seconds = 30
eureka.instance.hostname = ${HOSTNAME:student-service}
eureka.instance.prefer-ip-address = true
eureka.instance.metadata-map.environment = production

# Security and Performance
management.endpoints.web.exposure.include = health,info,metrics
management.endpoint.health.show-details = when-authorized